name: Web engine
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    # Match the locked engine's Managed Web workflow. Its include paths still
    # require Windows casing; the Railway cooker has a separate Linux patch.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install managed Web toolchain
        run: |
          dotnet workload install wasm-tools
      - run: npm ci
      - run: npm test
      - name: Build locked managed engine
        run: |
          New-Item -ItemType Directory -Force .engine | Out-Null
          npm run engine:build *> .engine/ci-engine-build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content .engine/ci-engine-build.log -Tail 80
          exit $buildExitCode
      - run: node tests/rougelike-logic.mjs
      - run: node tests/return-physics.mjs
      - run: node scripts/return-tilemap.test.mjs
      - run: npm run build
      - run: npx playwright install chromium
      - name: Browser regression
        env:
          TEST_BASE_URL: http://127.0.0.1:4173
          TEST_BROWSER_CHANNEL: chromium
          TEST_REQUIRE_AUDIO: '1'
          TEST_RETURN_WARMUP: '1'
          TEST_SOFTWARE_GPU: '1'
        run: |
          $preview = Start-Process node -ArgumentList 'node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4173', '--strictPort' -PassThru -WindowStyle Hidden -RedirectStandardOutput .engine/ci-preview.log -RedirectStandardError .engine/ci-preview-error.log
          try {
            foreach ($suite in @('browser', 'inspector-metadata-browser', 'project-authoring-browser', 'scene-ownership-browser', 'layout-exit-browser', 'rougelike-browser', 'catalog-browser', 'catalog-player-browser', 'return-homepage-browser', 'return-menu-browser', 'return-browser', 'return-orientation-browser')) {
              Write-Output "::group::$suite"
              node --experimental-strip-types "tests/$suite.mjs" *> ".engine/ci-$suite.log"
              $testExitCode = $LASTEXITCODE
              Get-Content ".engine/ci-$suite.log"
              Write-Output '::endgroup::'
              if ($testExitCode -ne 0) { exit $testExitCode }
            }
          } finally {
            Stop-Process -Id $preview.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-engine-evidence
          include-hidden-files: true
          path: |
            .engine/ci-*.log
            .engine/*.png
            .engine/rougelike-qa/*.png
            .engine/return-qa/**/*.png
            .engine/return-qa/**/evidence.json
            .engine/return-homepage-qa/**/*.png
            .engine/return-menu-qa/**/*.png
            .engine/return-menu-qa/**/evidence.json
            .engine/return-orientation-qa/**/*.png
            .engine/return-orientation-qa/**/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: tomcat-web-with-engine
          path: dist
