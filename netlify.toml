[build]
  command = "bash scripts/build-netlify.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  TOMCAT_API_ORIGIN = "https://tcenginewebbackend-production.up.railway.app"
  ENGINE_ARTIFACT_URL = "https://github.com/chnnasn/Tc_Engine_Web_Front/releases/download/web-engine-b6e9478a/tomcat-web-engine-b6e9478a.tar.gz"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
