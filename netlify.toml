[build]
  command = "bash scripts/build-netlify.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ENGINE_ARTIFACT_URL = "https://github.com/chnnasn/Tc_Engine_Web_Front/releases/download/web-engine-0b8829a8/tomcat-web-0b8829a8.tar.gz"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/engine/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/engine-cache-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/engine-cache-core.mjs"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/v1/*"
  to = "https://tcenginewebbackend-production.up.railway.app/v1/:splat"
  status = 200
  signed = "TOMCAT_PROXY_SECRET"

[[redirects]]
  from = "/health"
  to = "https://tcenginewebbackend-production.up.railway.app/health"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "https://tcenginewebbackend-production.up.railway.app/health"
  status = 200

[[redirects]]
  from = "/engine-cache/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/engine/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
